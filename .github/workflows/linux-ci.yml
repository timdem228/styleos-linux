name: linux-ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-ci
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare log folder
        run: mkdir -p "$RUNNER_TEMP/ci"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the one-time Linux port
        if: github.ref == 'refs/heads/main'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci/port.log") 2>&1
          set -x
          if [ ! -f port/apply_linux.py ]; then echo "port already applied"; exit 0; fi
          # the splash comment mentioned the old library by name and tripped the leftover check
          sed -i 's|// ImageSharp instead of System.Drawing (GDI+ is Windows-only on .NET 7+).|// ImageSharp instead of GDI+ (Windows-only on .NET 7+).|' port/apply_linux.py
          python3 port/apply_linux.py
          git config user.name "styleos-bot"
          git config user.email "styleos-bot@users.noreply.github.com"
          git rm -r -q -f port
          git add -A
          git status --short | head -50
          git commit -q -m "port: apply the Linux changes to the imported Windows sources"
          git push origin HEAD:main || echo "PUSH FAILED - continuing the build with the ported tree"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build styleos.csproj -c Release -nologo 2>&1 | tee "$RUNNER_TEMP/ci/build.log"

      - name: Publish (portable + self-contained x64/arm64)
        run: |
          dotnet publish styleos.csproj -c Release -o out/portable -p:UseAppHost=false -nologo
          dotnet publish styleos.csproj -c Release -r linux-x64 --self-contained true -o out/linux-x64 -nologo
          dotnet publish styleos.csproj -c Release -r linux-arm64 --self-contained true -o out/linux-arm64 -nologo
          file out/linux-x64/StyleOS out/linux-arm64/StyleOS | tee "$RUNNER_TEMP/ci/publish.log"

      - name: Smoke tests (self-contained linux-x64)
        run: bash tests/smoke.sh out/linux-x64/StyleOS 2>&1 | tee "$RUNNER_TEMP/ci/test.log"

      - name: Portable build check (dotnet StyleOS.dll)
        run: |
          { dotnet out/portable/StyleOS.dll --version; dotnet out/portable/StyleOS.dll -c "uname -a; fastfetch"; } 2>&1 | tee "$RUNNER_TEMP/ci/portable.log"

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/styleos-linux-x64.tar.gz -C out/linux-x64 .
          tar -czf dist/styleos-linux-arm64.tar.gz -C out/linux-arm64 .
          tar -czf dist/styleos-portable.tar.gz -C out/portable .
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -la dist | tee -a "$RUNNER_TEMP/ci/publish.log"

      - uses: actions/upload-artifact@v4
        with:
          name: styleos-linux
          path: dist/

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish CI logs to the ci-results branch
        if: always()
        run: |
          cd "$RUNNER_TEMP/ci"
          {
            echo "commit: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null)"
            echo "run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "status: ${{ job.status }}"
            echo "date:   $(date -u)"
          } > status.txt
          git init -q
          git checkout -q -b ci-results
          git config user.name "styleos-bot"
          git config user.email "styleos-bot@users.noreply.github.com"
          git add -A
          git commit -qm "ci logs for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
