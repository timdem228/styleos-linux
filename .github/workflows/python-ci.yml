name: termux-installer-ci

on:
  push:
    branches: [termux]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p "$RUNNER_TEMP/ci"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip install
        run: pip install ./python 2>&1 | tail -3 | tee "$RUNNER_TEMP/ci/pip.log"; styleos --version | tee -a "$RUNNER_TEMP/ci/pip.log"
      - name: Real end-to-end (downloads .NET 8 + code from GitHub, builds, runs)
        run: |
          sudo mv /usr/share/dotnet /usr/share/dotnet.hidden || true
          styleos install 2>&1 | tee "$RUNNER_TEMP/ci/e2e.log"
          styleos doctor 2>&1 | tee -a "$RUNNER_TEMP/ci/e2e.log"
          styleos run -c "uname -a; whoami; echo styleos-run-ok" 2>&1 | tee -a "$RUNNER_TEMP/ci/e2e.log"
          grep -q styleos-run-ok "$RUNNER_TEMP/ci/e2e.log"
          styleos update 2>&1 | tail -5 | tee -a "$RUNNER_TEMP/ci/e2e.log"
      - name: Publish logs to ci-results-termux
        if: always()
        run: |
          cd "$RUNNER_TEMP/ci"
          { echo "commit: ${{ github.sha }}"; echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo "status: ${{ job.status }}"; date -u; } > status.txt
          git init -q && git checkout -q -b ci-results-termux
          git config user.name styleos-bot && git config user.email styleos-bot@users.noreply.github.com
          git add -A && git commit -qm "termux ci logs"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results-termux

  termux-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: styleos install + run inside termux-docker
        run: |
          docker run --rm -v "$PWD:/repo" termux/termux-docker:x86_64 bash -c 'set -e; pkg update -y && pkg install -y python git; pip install /repo/python; styleos install; styleos run -c "uname -a; echo termux-run-ok"'
