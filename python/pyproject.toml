[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "styleos-installer"
version = "1.0.0"
description = "Installs, builds and runs StyleOS (Linux / Termux) from source: `styleos install`, `styleos run`"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "timdem228" }]

[project.urls]
Homepage = "https://github.com/timdem228/styleos-linux"

[project.scripts]
styleos = "styleos_installer.cli:main"

[tool.setuptools]
packages = ["styleos_installer"]
